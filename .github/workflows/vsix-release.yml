name: Publish VSIX Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      Configuration: Release
      VsixManifestPath: VSIX\DevWinUI_Template\DevWinUI_Template\source.extension.vsixmanifest
      VsixSourcePath: VSIX\DevWinUI_Template\DevWinUI_Template\source.extension.cs

    steps:
      - uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore
        run: msbuild /t:Restore

      - name: Version stamp
        uses: madskristensen/vsix-version-stamp@v2
        with:
          manifest-file: ${{ env.VsixManifestPath }}
          vsix-token-source-file: ${{ env.VsixSourcePath }}

      - name: Build
        run: msbuild /p:Configuration=Release
     
      - name: Resolve VSIX file path
        shell: pwsh
        run: |
          $vsixFile = Get-ChildItem -Path VSIX -Filter *.vsix -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $vsixFile) {
            Write-Host "::error::No VSIX file was produced by the build."
            exit 1
          }
          Write-Host "VSIX file: $vsixFile"
          "VSIX_FILE=$vsixFile" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish to Marketplace
        uses: madskristensen/publish-marketplace@v2
        with:
          extension-file: ${{ env.VSIX_FILE }}
          publish-manifest-file: vs-publish.json
          personal-access-code: ${{ secrets.VS_MARKETPLACE_TOKEN }}
